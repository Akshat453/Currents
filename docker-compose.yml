services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: currents
      POSTGRES_USER: currents
      POSTGRES_PASSWORD: currents
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currents"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - currents_postgres:/var/lib/postgresql/data
volumes:
  currents_postgres:
