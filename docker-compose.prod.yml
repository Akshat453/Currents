services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: apps/api/.env
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: http://localhost:4000/api, VITE_SOCKET_URL: http://localhost:4000 }
    ports: ["8080:80"]
    depends_on: [api]
  postgres:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: currents, POSTGRES_USER: currents, POSTGRES_PASSWORD: currents }
    healthcheck:
      { test: ["CMD-SHELL", "pg_isready -U currents"], interval: 5s, timeout: 5s, retries: 10 }
    volumes: ["currents_prod:/var/lib/postgresql/data"]
volumes: { currents_prod: {} }
